[project]
name = "autonomous-contributor"
version = "0.1.0"
description = "Autonomous multi-agent GitHub contributor: LangGraph orchestration + OpenCode implementation + Docker isolation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
contributor = "contributor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contributor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
